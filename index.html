<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <title>逐句朗读器</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div><p class="eyebrow">Swipe Reader</p><h1>逐句朗读器</h1></div>
      <button id="installBtn" class="ghost hidden" type="button">安装</button>
    </header>

    <section id="inputPanel" class="panel input-panel">
      <label for="articleInput">粘贴文章</label>
      <textarea id="articleInput" placeholder="把文章粘贴到这里……\n支持中文、英文和常见标点。"></textarea>
      <div class="row between"><span class="hint">文章只保存在本机浏览器</span><button id="loadBtn" class="primary" type="button">开始阅读</button></div>
    </section>

    <section id="readerPanel" class="reader hidden" aria-live="polite">
      <div class="reader-meta"><span id="progressText">第 1 句 / 共 1 句</span><div class="meta-actions"><button id="fullscreenBtn" class="text-btn" type="button">全屏阅读</button><button id="curtainBtn" class="text-btn" type="button">幕帘屏</button><button id="editBtn" class="text-btn" type="button">重新导入</button></div></div>
      <button id="exitFullscreenBtn" class="exit-fullscreen hidden" type="button">退出全屏</button>
      <article id="sentenceView" class="sentence-view" aria-label="文章内容"></article>
      <div class="swipe-tip">快速上划下一句　·　快速下划上一句　·　慢滑浏览</div>
      <div class="controls">
        <button id="prevBtn" class="control" type="button" aria-label="上一句">↑<small>上一句</small></button>
        <button id="playBtn" class="play" type="button" aria-label="朗读">▶</button>
        <button id="nextBtn" class="control" type="button" aria-label="下一句">↓<small>下一句</small></button>
      </div>
      <div class="settings">
        <label for="rateRange">语速 <output id="rateValue">1.0×</output></label>
        <input id="rateRange" type="range" min="0.5" max="2" step="0.1" value="1" />
        <label for="fontRange">字体大小 <output id="fontValue">48px</output></label>
        <input id="fontRange" type="range" min="22" max="64" step="1" value="48" />
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
